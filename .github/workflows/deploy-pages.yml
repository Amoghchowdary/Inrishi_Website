name: Deploy INRISHI Main Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

env:
  SITE_DOMAIN: www.inrishi.in

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact declared production/build dependencies
        run: npm install --include=dev --no-audit --no-fund --strict-peer-deps
      - name: Dependency tree
        run: npm ls --depth=0
      - name: Production acceptance checks
        run: npm run preflight
      - name: Prepare GitHub Pages artifact
        run: npm run prepare:pages -- "$SITE_DOMAIN"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: production
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
