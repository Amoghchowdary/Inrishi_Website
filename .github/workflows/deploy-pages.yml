name: Deploy INRISHI Main V81 Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

env:
  SITE_DOMAIN: www.inrishi.in

jobs:
  production:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout production source
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Deployment topology
        run: |
          echo "Custom domain: https://www.inrishi.in/"
          echo "GitHub project path: https://${{ github.repository_owner }}.github.io/Inrishi_Website/"
      - name: Verify deployed Apps Script backend contract
        run: node scripts/verify-backend-health.mjs
      - name: Install exact declared production/build dependencies
        run: npm install --include=dev --no-audit --no-fund --strict-peer-deps
      - name: Dependency tree
        run: npm ls --depth=0
      - name: Clean previous build artifact
        run: rm -rf dist
      - name: Production acceptance checks
        run: npm run preflight
      - name: Prepare GitHub Pages artifact
        run: npm run prepare:pages -- "$SITE_DOMAIN"
      - name: Verify V81 single-production artifact topology
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/404.html
          grep -q "404 / INRISHI" dist/404.html
          ! grep -Eq "location\.replace|/\?/|~and~" dist/404.html
          for p in services about-inrishi industries sample-work contact admin customer-login customer-portal; do test -f "dist/$p/index.html"; done
          for p in services/books-customization services/custom-software services/saas-products r; do test ! -e "dist/$p"; done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: production
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Post-deploy production smoke test
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Testing deployed site: $URL"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if body=$(curl --fail --silent --show-error --location --max-time 20 "$URL"); then
              if printf '%s' "$body" | grep -qi "Inrishi" && printf '%s' "$body" | grep -q "GTM-WSCMN3T2"; then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" -eq 1 || { echo "Production smoke test failed: deployed page did not return INRISHI HTML with the expected GTM container."; exit 1; }
          code=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 20 "$URL/v81-route-that-must-not-exist")
          test "$code" = "404" || { echo "Expected hard 404 for unknown route, got HTTP $code"; exit 1; }
          for path in services admin customer-login; do
            code=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 20 "$URL/$path/")
            test "$code" = "200" || { echo "Expected HTTP 200 for /$path/, got $code"; exit 1; }
          done
          echo "Production smoke test passed with strict 404 topology."
