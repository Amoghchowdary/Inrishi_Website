name: Deploy INRISHI Main Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

env:
  SITE_DOMAIN: www.inrishi.in

jobs:
  production:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout production source
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Deployment topology
        run: |
          echo "Custom domain: https://www.inrishi.in/"
          echo "GitHub project path: https://${{ github.repository_owner }}.github.io/Inrishi_Website/"
      - name: Install exact declared production/build dependencies
        run: npm install --include=dev --no-audit --no-fund --strict-peer-deps
      - name: Dependency tree
        run: npm ls --depth=0
      - name: Production acceptance checks
        run: npm run preflight
      - name: Prepare GitHub Pages artifact
        run: npm run prepare:pages -- "$SITE_DOMAIN"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: production
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
