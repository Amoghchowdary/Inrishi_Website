name: Deploy Inrishi Production Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'www.inrishi.in' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate dependency manifest
        run: node scripts/verify-dependencies.mjs
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --strict-peer-deps
      - name: Confirm dependency tree
        run: npm ls --depth=0
      - name: Validate deployment variables
        shell: bash
        run: |
          test -n "$SITE_DOMAIN" || (echo "SITE_DOMAIN is missing" && exit 1)
          echo "Deploying custom domain: $SITE_DOMAIN"
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Production acceptance checks
        run: npm run preflight
      - name: Prepare custom-domain Pages output
        run: npm run prepare:pages -- "$SITE_DOMAIN"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
