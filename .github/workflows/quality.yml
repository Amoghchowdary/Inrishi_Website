name: Inrishi Production Quality Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-dependencies.mjs
      - run: npm install --include=dev --no-audit --no-fund --strict-peer-deps
      - run: npm ls --depth=0
      - run: npm run audit:prod
      - run: npm run preflight
