<text x="72" y="126" fill="#c9d4e8" font-family="Arial, Helvetica, sans-serif" font-size="18">Every customer conversation gets a clear next action.</text>

<g transform="translate(65 170)" filter="url(#shadow)"><rect width="1070" height="430" rx="30" fill="#101d32" stroke="#344f7a"/><rect x="24" y="24" width="190" height="382" rx="20" fill="#0d1728"/><text x="52" y="70" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Customers</text><rect x="42" y="100" width="154" height="46" rx="12" fill="url(#a)" opacity=".85"/><text x="72" y="129" fill="#fff" font-family="Arial" font-size="14" font-weight="700">Leads</text><text x="52" y="190" fill="#c5cee0" font-family="Arial" font-size="14">Calls</text><text x="52" y="230" fill="#c5cee0" font-family="Arial" font-size="14">Messages</text><text x="52" y="270" fill="#c5cee0" font-family="Arial" font-size="14">Follow-ups</text><g transform="translate(240 24)"><rect width="806" height="100" rx="18" fill="#152640"/><text x="28" y="42" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Today</text><text x="28" y="74" fill="#c4cfe3" font-family="Arial" font-size="14">24 new leads · 8 calls · 5 follow-ups</text></g><g transform="translate(240 146)"><rect width="806" height="110" rx="18" fill="#13233b"/><circle cx="55" cy="55" r="24" fill="url(#a)"/><text x="95" y="48" fill="#fff" font-family="Arial" font-size="17" font-weight="700">Incoming customer call</text><text x="95" y="76" fill="#c4cfe3" font-family="Arial" font-size="13">Customer history opens automatically</text><text x="670" y="62" fill="#fff" font-family="Arial" font-size="14">Open profile →</text></g><g transform="translate(240 278)"><rect width="806" height="128" rx="18" fill="#13233b"/><text x="28" y="42" fill="#fff" font-family="Arial" font-size="17" font-weight="700">One customer timeline</text><text x="28" y="72" fill="#c4cfe3" font-family="Arial" font-size="13">Calls, messages, notes and the next action stay together.</text><path d="M30 100h730" stroke="#32486d"/><circle cx="150" cy="100" r="8" fill="#7288ff"/><circle cx="390" cy="100" r="8" fill="#a46cff"/><circle cx="650" cy="100" r="8" fill="#fff"/></g></g>
