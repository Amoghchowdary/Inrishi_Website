<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Digital foundation">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0c1730"/></linearGradient>
  <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5B7CFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="1200" height="760" rx="48" fill="url(#bg)"/>
<circle cx="1020" cy="100" r="180" fill="#5B7CFF" opacity=".08"/><circle cx="120" cy="670" r="240" fill="#8A5CFF" opacity=".06"/>
<text x="72" y="88" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Digital foundation</text>
<text x="72" y="126" fill="#c9d4e8" font-family="Arial, Helvetica, sans-serif" font-size="18">Website, CRM and employee systems make work visible.</text>

<g transform="translate(60 170)" filter="url(#shadow)">
  <rect width="650" height="420" rx="28" fill="#101c31" stroke="#334d76"/>
  <rect x="30" y="30" width="590" height="52" rx="14" fill="#0b1526"/><circle cx="58" cy="56" r="6" fill="#65738c"/><circle cx="78" cy="56" r="6" fill="#65738c"/><circle cx="98" cy="56" r="6" fill="#65738c"/>
  <text x="132" y="63" fill="#fff" font-family="Arial" font-size="15">yourbusiness.in</text>
  <rect x="30" y="106" width="282" height="270" rx="20" fill="#15243b"/><rect x="336" y="106" width="284" height="126" rx="20" fill="#172844"/><rect x="336" y="250" width="284" height="126" rx="20" fill="#172844"/>
  <text x="58" y="150" fill="#fff" font-family="Arial" font-size="24" font-weight="700">Business Website</text><text x="58" y="183" fill="#bdc8dc" font-family="Arial" font-size="15">Search-ready. Mobile-ready.</text>
  <rect x="58" y="222" width="210" height="100" rx="16" fill="url(#a)" opacity=".9"/><text x="82" y="266" fill="#fff" font-family="Arial" font-size="16" font-weight="700">Google presence</text><text x="82" y="292" fill="#eef2ff" font-family="Arial" font-size="13">Website + SEO + profile</text>
  <text x="364" y="150" fill="#fff" font-family="Arial" font-size="19" font-weight="700">CRM</text><text x="364" y="182" fill="#bdc8dc" font-family="Arial" font-size="14">Leads → calls → follow-up</text>
  <text x="364" y="294" fill="#fff" font-family="Arial" font-size="19" font-weight="700">Employee system</text><text x="364" y="326" fill="#bdc8dc" font-family="Arial" font-size="14">Attendance → leave → records</text>
</g>
<g transform="translate(760 240)">
  <rect width="340" height="250" rx="26" fill="#111e34" stroke="#3b527e"/>
  <text x="34" y="52" fill="#fff" font-family="Arial" font-size="20" font-weight="700">One digital foundation</text>
  <text x="34" y="94" fill="#fff" font-family="Arial" font-size="16">✓ customers can find you</text><text x="34" y="130" fill="#fff" font-family="Arial" font-size="16">✓ every lead has a next step</text><text x="34" y="166" fill="#fff" font-family="Arial" font-size="16">✓ employee work becomes visible</text><text x="34" y="202" fill="#fff" font-family="Arial" font-size="16">✓ managers see the whole picture</text>
</g>
</svg>