<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Employee Management">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0c1730"/></linearGradient>
  <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5B7CFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="1200" height="760" rx="48" fill="url(#bg)"/>
<circle cx="1020" cy="100" r="180" fill="#5B7CFF" opacity=".08"/><circle cx="120" cy="670" r="240" fill="#8A5CFF" opacity=".06"/>
<text x="72" y="88" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Employee Management</text>
<text x="72" y="126" fill="#c9d4e8" font-family="Arial, Helvetica, sans-serif" font-size="18">Attendance, leave and employee records in one place.</text>

<g transform="translate(70 170)" filter="url(#shadow)"><rect width="1060" height="430" rx="30" fill="#101d32" stroke="#344f7a"/><g transform="translate(30 30)"><rect width="1000" height="82" rx="18" fill="#14253f"/><circle cx="52" cy="41" r="24" fill="url(#a)"/><text x="95" y="35" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Arun Kumar</text><text x="95" y="60" fill="#c5cee0" font-family="Arial" font-size="13">Checked in · 09:12 AM</text><text x="770" y="50" fill="#fff" font-family="Arial" font-size="14">Attendance synced</text></g><g transform="translate(30 140)"><rect width="300" height="120" rx="20" fill="#14253f"/><text x="26" y="38" fill="#c4cee0" font-family="Arial" font-size="13">Present today</text><text x="26" y="82" fill="#fff" font-family="Arial" font-size="34" font-weight="700">42</text></g><g transform="translate(350 140)"><rect width="300" height="120" rx="20" fill="#14253f"/><text x="26" y="38" fill="#c4cee0" font-family="Arial" font-size="13">On leave</text><text x="26" y="82" fill="#fff" font-family="Arial" font-size="34" font-weight="700">03</text></g><g transform="translate(670 140)"><rect width="360" height="120" rx="20" fill="#14253f"/><text x="26" y="38" fill="#c4cee0" font-family="Arial" font-size="13">Pending requests</text><text x="26" y="82" fill="#fff" font-family="Arial" font-size="34" font-weight="700">02</text></g><g transform="translate(30 282)"><rect width="1000" height="118" rx="20" fill="#13233b"/><text x="28" y="42" fill="#fff" font-family="Arial" font-size="17" font-weight="700">Leave request · Priya</text><text x="28" y="72" fill="#c4cee0" font-family="Arial" font-size="13">2 days · manager approval required</text><rect x="830" y="34" width="130" height="48" rx="12" fill="url(#a)"/><text x="867" y="64" fill="#fff" font-family="Arial" font-size="14" font-weight="700">Approve</text></g></g>
</svg>