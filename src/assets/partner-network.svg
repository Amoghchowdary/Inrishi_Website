<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Inrishi Partner Network">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0c1730"/></linearGradient>
  <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5B7CFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="1200" height="760" rx="48" fill="url(#bg)"/>
<circle cx="1020" cy="100" r="180" fill="#5B7CFF" opacity=".08"/><circle cx="120" cy="670" r="240" fill="#8A5CFF" opacity=".06"/>
<text x="72" y="88" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Inrishi Partner Network</text>
<text x="72" y="126" fill="#c9d4e8" font-family="Arial, Helvetica, sans-serif" font-size="18">Recognise the problem. Refer it. Track it privately.</text>

<g transform="translate(70 175)">
  <rect x="0" y="70" width="250" height="170" rx="24" fill="#111e33" stroke="#344d78"/><text x="28" y="115" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Business problem</text><text x="28" y="150" fill="#c5cee0" font-family="Arial" font-size="13">“We lose customer follow-ups.”</text><text x="28" y="184" fill="#c5cee0" font-family="Arial" font-size="13">“Our staff work is manual.”</text>
  <path d="M266 155h90" stroke="url(#a)" stroke-width="7"/><path d="M344 140l24 15-24 15" fill="none" stroke="#fff" stroke-width="5"/>
  <rect x="380" y="30" width="300" height="250" rx="30" fill="#14233b" stroke="#526cff" stroke-width="2" filter="url(#shadow)"/><text x="420" y="82" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Partner Portal</text><text x="420" y="118" fill="#c5cee0" font-family="Arial" font-size="13">Submit the real opportunity</text><rect x="420" y="150" width="220" height="42" rx="10" fill="#0c1728"/><text x="440" y="176" fill="#fff" font-family="Arial" font-size="13">Lead added · ABC Retail</text><rect x="420" y="205" width="220" height="42" rx="10" fill="#0c1728"/><text x="440" y="231" fill="#fff" font-family="Arial" font-size="13">Admin chat available</text>
  <path d="M696 155h90" stroke="url(#a)" stroke-width="7"/><path d="M774 140l24 15-24 15" fill="none" stroke="#fff" stroke-width="5"/>
  <rect x="810" y="70" width="310" height="170" rx="24" fill="#111e33" stroke="#344d78"/><text x="840" y="115" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Inrishi takes over</text><text x="840" y="150" fill="#c5cee0" font-family="Arial" font-size="13">Demo · scope · quote · build</text><text x="840" y="184" fill="#c5cee0" font-family="Arial" font-size="13">Partner tracks privately</text>
</g>
<g transform="translate(220 520)"><rect width="760" height="90" rx="22" fill="#0e192c" stroke="#2f4267"/><text x="32" y="38" fill="#fff" font-family="Arial" font-size="17" font-weight="700">You do not need to be a software expert.</text><text x="32" y="66" fill="#c2cce0" font-family="Arial" font-size="13">Recognise the problem. Make the introduction. Use the portal to follow the opportunity.</text></g>
</svg>